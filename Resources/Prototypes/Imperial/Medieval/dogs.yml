- type: entity
  parent: BaseItem
  id: PetCollar
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: PetCollar

- type: entity
  id: ActionBadSmellItemTracker
  components:
    - type: Action
      itemIconStyle: BigAction
      priority: 3
      useDelay: 45
      icon:
        sprite: /Textures/Imperial/Medieval/BadSmell/actions.rsi
        state: ZakisMyDog
    - type: TargetAction
      range: 1.5
      interactOnMiss: false
      targetingIndicator: true
      deselectOnMiss: true
      repeat: false
      checkCanAccess: false
    - type: EntityTargetAction
      canTargetSelf: false
      event: !type:BadSmellItemTrackerActionEvent

- type: inventoryTemplate
  id: MedievalDogInventory
  slots:
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 6
      uiWindowPos: 0, 0
      strippingWindowPos: 0, 0
      displayName: Suit
      whitelist:
        tags:
        - DogEquipment
    - name: back
      slotTexture: back
      slotFlags: BACK
      stripTime: 6
      uiWindowPos: 1, 0
      strippingWindowPos: 1, 0
      displayName: Back
      whitelist:
        tags:
        - DogEquipment

