- type: entity
  parent:
    - BaseSimpleMob
    - MobCombat
    - MobAtmosExposed
  id: MedievalMobBaseDog
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/Medieval/Mobs/dogs/borzoi_0.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "outerClothing" ]
    - map: [ "back" ]
  - type: Physics
  - type: Sharp
  - type: BadSmellItemFeel
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damageCap: 200
    damage:
      groups:
        Brute: -0.25
        Burn: -0.25
        Airloss: -0.5
        Toxin: -0.25
      types:
        Cellular: -0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 4
    - id: MedievalLeather1
      amount: 3
  - type: MindContainer
    showExamineInfo: true
  - type: Bloodstream
    bloodMaxVolume: 40
    bloodlossDamage:
      types:
        Bloodloss: 0.75
    bloodlossHealDamage:
      types:
        Bloodloss: -1
  - type: StaminaDamageOnHit
    damage: 10
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    angle: 0
    soundHit:
      collection: AlienClaw
    animation: WeaponArcBite
    damage:
      groups:
        Brute: 12
      types:
        ParryAble: 1
  - type: Puller
    needsHands: false
  - type: MobThresholds
    thresholds:
      0: Alive
      95: Critical
      190: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.75
    baseSprintSpeed: 3.0
  - type: SlowOnDamage
    speedModifierThresholds:
      40: 1
      55: 0.9
      65: 0.87
      75: 0.85
      90: 0.82
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: MedievalDash
    force: 750
  - type: InputMover
  - type: MobMover
  - type: Vocal
    sounds:
      Unsexed: Dog
  - type: NocturnBadFood
    timesCanBeBiten: 3
  - type: LanguageSpeaker
    languages:
      Common: Understand
      Goblin: Understand
      #Ancient: Speak
      #Tribe: Speak
      #Orc: Speak
      #Cursed: Speak
      Growling: Speak
      Hissing: Understand
      #Elf: Speak
  - type: AllergySpreader
    id: Fur
  - type: Speech
  - type: ComplexInteraction
  - type: TypingIndicator
    proto: wolf
  - type: BadSmellFeel
  - type: BadSmellVision
    smellThreshold: 50.0
    radius: 8
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
    - Animal #Этот тег убирает из колеса эмоций мобов "человеческие" эмоции (чихание, свист и т.д)
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - StaminaModifier
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: Perishable
  - type: BadSmellItemTracker
  - type: Body
    prototype: Animal
  - type: Hunger
    thresholds: # only animals and rats are derived from this prototype so let's override it here and in rats' proto
      Overfed: 100
      Okay: 50
      Peckish: 25
      Starving: 10
      Dead: 0
    baseDecayRate: 0.00925925925926 # it is okay for animals to eat and drink less than humans, but more frequently
  - type: Thirst
    thresholds:
      OverHydrated: 200
      Okay: 150
      Thirsty: 100
      Parched: 50
      Dead: 0
    baseDecayRate: 0.04
  - type: Inventory
    templateId: MedievalDogInventory
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface


